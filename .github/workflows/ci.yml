name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every supported Python version runs the full core suite. Optional extras get their own jobs.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      # Every command pins the interpreter. A bare `uv run` would re-select the default Python and
      # rebuild the environment, which drops anything the sync installed.
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --locked --python ${{ matrix.python-version }} ruff check .
      - run: uv run --locked --python ${{ matrix.python-version }} ruff format --check .
      - run: uv run --locked --python ${{ matrix.python-version }} mypy
      - run: uv run --locked --python ${{ matrix.python-version }} pytest
      - run: uv run --locked --python ${{ matrix.python-version }} microflow make-sample-data --out-dir "$RUNNER_TEMP/synthetic"

  reference:
    # Fails if the committed CLI and HTTP reference differs from the code, and runs the tests that need
    # only the standard library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: python3 scripts/generate_reference.py --check
      - run: uv run pytest tests/test_provenance_verify.py tests/test_stats_report.py

  ml:
    # CPU-only PyTorch. The ML tests run here; the GPU test is skipped without CUDA.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --extra ml --python ${{ matrix.python-version }}
      # Each command repeats --extra ml, so torch stays installed and the ML tests cannot skip silently.
      - run: uv run --locked --extra ml --python ${{ matrix.python-version }} python -c "import torch; print('torch', torch.__version__)"
      - run: uv run --locked --extra ml --python ${{ matrix.python-version }} pytest -m ml -rs
      - run: uv run --locked --extra ml --python ${{ matrix.python-version }} microflow ml make-dataset data/synthetic-ml --samples 6 --size 64 --seed 0
      - run: uv run --locked --extra ml --python ${{ matrix.python-version }} microflow ml splits examples/ml/synthetic.yaml
      - run: uv run --locked --extra ml --python ${{ matrix.python-version }} microflow ml train examples/ml/synthetic.yaml --device cpu
      - run: uv run --locked --extra ml --python ${{ matrix.python-version }} microflow ml evaluate examples/ml/synthetic.yaml data/ml-runs/synthetic-unet/best.pt

  service:
    # The HTTP service needs the optional extra. The rest of the suite runs without it.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --extra service --python ${{ matrix.python-version }}
      # Each command repeats --extra service, so FastAPI stays installed and the service tests run.
      - run: uv run --locked --extra service --python ${{ matrix.python-version }} python -c "import fastapi; print('fastapi', fastapi.__version__)"
      - run: uv run --locked --extra service --python ${{ matrix.python-version }} pytest -m service -rs

  demo:
    # The end-to-end demonstration: synthetic images to segmentation, statistics, the HTML report and
    # provenance checks. It writes to data/demo and removes that directory afterwards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run python examples/demo/run_demo.py --clean
      - name: Remove generated demo data
        if: always()
        run: rm -rf data/demo
