[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "microflow-example-plugins"
version = "1.0.0"
description = "Example MicroFlow plugins, one per plugin kind. For documentation and contract tests."
requires-python = ">=3.12"
dependencies = ["microflow", "numpy>=1.26", "pydantic>=2.6", "scipy>=1.12"]

[project.entry-points."microflow.preprocessors"]
example-offset = "microflow_example_plugins.preprocessor:ExampleOffset"

[project.entry-points."microflow.segmenters"]
example-quantile = "microflow_example_plugins.segmenter:ExampleQuantileSegmenter"

[project.entry-points."microflow.features"]
example-object-range = "microflow_example_plugins.feature:ExampleObjectRange"

[project.entry-points."microflow.qc_checks"]
example-small-fraction = "microflow_example_plugins.qc:ExampleSmallObjectFraction"

[tool.hatch.build.targets.wheel]
packages = ["src/microflow_example_plugins"]
