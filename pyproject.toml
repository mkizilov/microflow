[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "microflow"
version = "0.1.0"
description = "Scientific image processing and quantitative analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mykyta Kizilov" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "tifffile>=2024.8.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.9",
    "pyarrow>=16.0",
]

[project.scripts]
microflow = "microflow.cli:app"

# The trained-model segmenter. Its module does not import PyTorch until a plane is segmented.
[project.entry-points."microflow.segmenters"]
ml-unet = "microflow.ml.plugin:UNetSegmenter"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional: segmentation training with PyTorch. Core features do not need it.
ml = ["torch>=2.4"]
# Optional: the HTTP analysis service (microflow serve). The CLI works without it.
service = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/microflow"]

[tool.uv]
default-groups = ["dev"]

# PyTorch's CPU-only wheels on Linux keep CI small. macOS and Windows use the default index.
# To use CUDA wheels on Linux, remove the torch entry below and re-lock.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ml: needs the optional PyTorch extra (uv sync --extra ml)",
    "gpu: needs a CUDA device",
    "service: needs the optional service extra (uv sync --extra service)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# PyTorch is optional. Without it, torch is untyped, so mypy cannot check the torch-facing modules
# strictly; those modules relax two checks that depend on torch's types.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

# SciPy, pyarrow and scikit-image ship no type information in the locked versions, so values from them
# are Any. These overrides ignore the missing stubs, and relax the two checks that depend on those types
# in the few modules that call them. The rest of each module stays strictly checked.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "pyarrow", "pyarrow.*", "skimage", "skimage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "microflow.preprocessing.operations",
    "microflow.segmentation.algorithms",
    "microflow.segmentation.pipeline",
    "microflow.quantification.features",
    "microflow.reporting.figures",
    "microflow.stats.estimators",
    "microflow.ml.train",
]
warn_return_any = false
disallow_untyped_calls = false

# The HTTP service's optional extra. Route decorators come from FastAPI, which is untyped when absent.
[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "starlette", "starlette.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["microflow.service.app", "microflow.service.server"]
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "microflow.ml.unet",
    "microflow.ml.losses",
    "microflow.ml.torch_data",
    "microflow.ml.checkpoint",
    "microflow.ml.inference",
    "microflow.ml.train",
    "microflow.ml.evaluate",
    "test_ml_torch",
]
disallow_subclassing_any = false
warn_return_any = false
