[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "microflow"
version = "0.1.0"
description = "Scientific image processing and quantitative analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "tifffile>=2024.8.30",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.scripts]
microflow = "microflow.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/microflow"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
